name: Wardrobe audit

on:
  pull_request:
    paths:
      - 'packages/wardrobe-catalog/**'
      - 'avenlab-server/src/alpha/character.rs'
      - 'frontend/src/game/characters/**'
      - 'frontend/public/models/characters/**'
      - 'frontend/scripts/**'
      - 'frontend/tests/**'
      - 'frontend/package*.json'
      - 'frontend/vite.config.ts'
      - '.github/workflows/wardrobe-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run audit:wardrobe

  real-assets:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Materialize wardrobe audit inputs
        run: |
          git lfs install --local
          assets=$(npm --prefix frontend run --silent audit:wardrobe -- --list-lfs)
          test -n "$assets"
          git lfs pull --include="$assets" --exclude=""
      - run: npm --prefix frontend run audit:wardrobe -- --full
