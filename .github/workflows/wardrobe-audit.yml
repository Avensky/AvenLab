name: Wardrobe audit

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Audit to run
        type: choice
        required: true
        default: full
        options:
          - full
          - fixtures

permissions:
  contents: read

jobs:
  fixtures:
    if: inputs.scope == 'fixtures'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run audit:wardrobe

  real-assets:
    if: inputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Materialize wardrobe audit inputs
        run: |
          git lfs install --local
          assets=$(npm --prefix frontend run --silent audit:wardrobe -- --list-lfs)
          test -n "$assets"
          git lfs pull --include="$assets" --exclude=""
      - run: npm --prefix frontend run audit:wardrobe -- --full

  character-profiles:
    if: inputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked --manifest-path avenlab-server/Cargo.toml character
