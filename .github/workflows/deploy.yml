name: Deploy AvenLab

on:
  push:
    branches:
      - main

concurrency:
  group: avenlab-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Pull Git LFS files
        run: |
          git lfs install
          git lfs pull

      - name: Verify GLB files are real
        run: |
          file frontend/public/models/vehicles/ae86.glb
          head -c 20 frontend/public/models/vehicles/ae86.glb

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eux
          if [ ! -x "$HOME/.cargo/bin/rustc" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: avenlab-server

      - name: Run project checks
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          npm run check

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build Rust physics server outside workspace
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd avenlab-server
          cargo build --release --target-dir /tmp/avenlab-rust-build

      - name: Install runtime files
        run: |
          sudo rsync -a --delete --exclude '.venv' --chown=uri:uri data-server/ /var/www/avenlab/current/data-server/
          sudo rsync -a --delete --chown=uri:uri frontend/dist/ /var/www/avenlab/current/frontend/dist/
          sudo install -o uri -g uri -m 755 /tmp/avenlab-rust-build/release/avenlab-server /var/www/avenlab/bin/avenlab-server

      - name: Install production data-server venv
        run: |
          sudo -u uri bash -lc '
            cd /var/www/avenlab/current/data-server
            python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
          '

      - name: Start backend services
        run: |
          sudo systemctl daemon-reload

          sudo systemctl enable avenlab-data
          sudo systemctl restart avenlab-data
          sudo systemctl is-active --quiet avenlab-data

          sudo systemctl enable avenlab-physics
          sudo systemctl restart avenlab-physics
          sudo systemctl is-active --quiet avenlab-physics

      - name: Test and reload NGINX
        run: |
          sudo nginx -t
          sudo systemctl reload nginx

      - name: Health check frontend
        run: |
          curl -f http://127.0.0.1/ > /dev/null

      - name: Health check physics port
        run: |
          ss -ltn | grep ':9001'

      - name: Optional data-server health check
        continue-on-error: true
        run: |
          systemctl is-active --quiet avenlab-data
          curl -f http://127.0.0.1:8001/health

      - name: Optional Ollama health check
        continue-on-error: true
        run: |
          curl -f http://127.0.0.1:11434/api/tags

      - name: Health check virtual CAN
        continue-on-error: true
        run: |
          ip link show vcan0

      - name: Health check physical CAN
        continue-on-error: true
        run: |
          ip link show can0
          ip link show can1
