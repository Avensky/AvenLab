name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Cache Python pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('data-server/requirements.txt') }}

      - name: Cache Rust cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            physics-server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('physics-server/Cargo.lock') }}

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Python dependencies
        run: |
          cd data-server
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run project checks
        run: npm run check

  build:
    needs: check
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Cache Rust cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            physics-server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('physics-server/Cargo.lock') }}

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Confirm Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build Rust physics server
        run: |
          cd physics-server
          cargo build --release

  deploy:
    needs: build
    runs-on: self-hosted
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restart AvenLab services
        run: |
          sudo systemctl restart avenlab-data || true
          sudo systemctl restart avenlab-physics || true
          sudo systemctl restart nginx || true

      - name: Deploy complete
        run: echo "AvenLab deploy complete"
