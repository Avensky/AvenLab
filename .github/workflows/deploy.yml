name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: self-hosted
    steps:
      - name: Stop the server
        run: |
          pm2 stop AMLVF

      - name: Checkout to the repository
        uses: actions/checkout@v4

      - name: Use system Python
        run: |
          python3 --version
          pip3 --version

      - name: Cache Python packages
        id: cache-python
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          pip3 install --break-system-packages -r python/requirements.txt

      - name: Check and install Ollama
        run: |
          if ! command -v ollama &> /dev/null; then
            echo "🔧 Installing Ollama..."
            curl -fsSL https://ollama.com/install.sh | sh
          else
            echo "✅ Ollama already installed"
          fi
 
      - name: Ensure nomic-embed-text model is available
        run: |
          if ! ollama list | grep -q 'nomic-embed-text'; then
            ollama pull nomic-embed-text
          fi
         
      - name: Check Ollama health
        run: |
          ollama serve &
          sleep 3
          curl -s http://localhost:11434/api/tags || echo "⚠️ Ollama did not respond"

      - name: Set up NodeJS environment
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8
    
      - name: Cache node modules
        id: cache-backend
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: node_modules
          key: ${{runner.os}}-${{ env.cache-name }}-${{ hashFiles('package-lock.json')}}
          restore-keys: |
            ${{ runner.os }}-${{ env.cache-name }}-
            ${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Check linting and formatting
        run: npm run lint
        
      - name: Check Postgres
        run: docker compose up -d

      - name: Wait for Postgres
        run: |
          chmod +x wait-for-it.sh
          ./wait-for-it.sh localhost echo "✅ DB ready!"

      - name: Re-run schema.sql if needed
        run: docker exec $(docker ps -qf "ancestor=ankane/pgvector") psql -U postgres -d amlvf -f /docker-entrypoint-initdb.d/schema.sql

      - name: Run testVector.js
        run: node database/testVector.js

      - name: Verify DB schema
        run: docker exec $(docker ps -qf "ancestor=ankane/pgvector") psql -U postgres -d amlvf -c '\dt'

  frontend:
    needs: backend
    runs-on: self-hosted
    steps:
      - name: Checkout to the repository
        uses: actions/checkout@v4

      - name: Set up NodeJS environment
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8

      - name: Cache node modules
        id: cache-frontend
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: frontend/node_modules
          key: ${{runner.os}}-frontend-${{env.cache-name}}-${{ hashFiles('frontend/package-lock.json')}}
          restore-keys: |
            ${{ runner.os }}-frontend-${{ env.cache-name }}
            ${{ runner.os }}-frontend-
            ${{ runner.os }}-

      - name: Install Dependencies
        if: steps.cache-frontend.outputs.cache-hit !='true'
        run: |
          cd frontend
          npm ci

      - name: Check linting and formatting
        run: |
          cd frontend
          npm run lint

  build:
    needs: frontend
    runs-on: self-hosted
    steps:
      - name: Checkout to the repository
        uses: actions/checkout@v4

      - name: Set up NodeJS environment
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8

      - name: Use cache node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
          key: |
            backend-cache-backend-${{ hashFiles('package-lock.json')}}
            frontend-cache-frontend-${{ hashFiles('frontend/package-lock.json')}}

      - name: Install Dependencies
        run: |
          npm ci
          cd frontend
          npm ci

      - name: Ensure vcan0 is active
        run: |
          sudo modprobe can
          sudo modprobe vcan
          sudo modprobe can_raw
          if ! ip link show vcan0 > /dev/null 2>&1; then
            sudo ip link add dev vcan0 type vcan
            sudo ip link set up vcan0
            echo "✅ vcan0 created"
          else
            echo "✅ vcan0 already exists"
          fi

      - name: Verify vcan0 is running
        run: ip link show vcan0
        
      - name: Create production build
        run: |
          cd frontend
          npm run build
          pm2 start AMLVF --update-env
          pm2 save

          sudo service nginx restart
