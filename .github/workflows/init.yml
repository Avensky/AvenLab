name: Initial Deployment

on:
  workflow_dispatch:

concurrency:
  group: avenlab-deploy
  cancel-in-progress: true

jobs:
  init:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Confirm Node version
        run: |
          node -v
          npm -v

      - name: Create runtime directories
        run: |
          sudo install -d -o uri -g uri /var/www/avenlab/bin
          sudo install -d -o uri -g uri /var/www/avenlab/current/frontend
          sudo install -d -o uri -g uri /var/www/avenlab/current/data-server

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Pull Git LFS files
        run: |
          git lfs install
          git lfs pull

      - name: Verify GLB files are real
        run: |
          file frontend/public/models/vehicles/ae86.glb
          head -c 20 frontend/public/models/vehicles/ae86.glb
          echo

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eux
          echo "HOME=$HOME"
          echo "USER=$(whoami)"

          if [ ! -x "$HOME/.cargo/bin/rustc" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"

          rustc --version
          cargo --version

      - name: Run project checks
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          npm run check

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build Rust physics server outside workspace
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd avenlab-server
          cargo build --release --target-dir /tmp/avenlab-rust-build

      - name: Install runtime files
        run: |
          sudo rsync -a --delete --exclude '.venv' --chown=uri:uri data-server/ /var/www/avenlab/current/data-server/
          sudo rsync -a --delete --chown=uri:uri frontend/dist/ /var/www/avenlab/current/frontend/dist/
          sudo install -o uri -g uri -m 755 /tmp/avenlab-rust-build/release/avenlab-server /var/www/avenlab/bin/avenlab-server

      - name: Install production data-server venv
        run: |
          sudo -u uri bash -lc '
            cd /var/www/avenlab/current/data-server
            python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
          '

      - name: Install and initialize PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib

          sudo systemctl enable postgresql
          sudo systemctl start postgresql

          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='avenlab_data'" | grep -q 1; then
            sudo -u postgres createdb avenlab_data
          fi

          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='avenlab'" | grep -q 1; then
            sudo -u postgres psql -c "CREATE USER avenlab WITH PASSWORD 'mysecretpassword';"
          fi

          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE avenlab_data TO avenlab;"
          sudo -u postgres psql -d avenlab_data -c "GRANT ALL ON SCHEMA public TO avenlab;"
          sudo -u postgres psql -d avenlab_data -c "ALTER SCHEMA public OWNER TO avenlab;"

      - name: Start backend services
        run: |
          sudo systemctl daemon-reload

          sudo systemctl enable avenlab-data
          sudo systemctl restart avenlab-data

          sudo systemctl enable avenlab-physics
          sudo systemctl restart avenlab-physics

          sudo systemctl status avenlab-data --no-pager -l || true
          sudo systemctl status avenlab-physics --no-pager -l || true

      - name: Verify deployment, database, and CAN write path
        run: |
          echo "Checking avenlab-data service status..."
          sudo systemctl status avenlab-data --no-pager -l || true

          echo "Waiting for data server on port 8001..."
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/health; then
              echo
              echo "Data server is ready."
              break
            fi

            echo "Attempt $i: data server not ready yet..."
            sleep 1

            if [ "$i" -eq 30 ]; then
              echo "Data server failed to become ready."
              echo "---- avenlab-data status ----"
              sudo systemctl status avenlab-data --no-pager -l || true
              echo "---- avenlab-data logs ----"
              journalctl -u avenlab-data -n 150 --no-pager || true
              exit 1
            fi
          done

          echo "Checking APP_ENV loaded into systemd process..."
          PID=$(systemctl show -p MainPID --value avenlab-data)
          sudo tr '\0' '\n' < /proc/$PID/environ | grep '^APP_ENV=production$'

          echo "Checking OpenAPI CAN routes..."
          curl -fsS http://127.0.0.1:8001/openapi.json > /tmp/avenlab-openapi.json

          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/avenlab-openapi.json"))

          print("CAN routes:")
          for path in sorted(data["paths"]):
              if "can" in path:
                  print(path)

          required = [
              "/data/can/status",
              "/data/can/session/start",
              "/data/can/session/{session_id}/marker",
              "/data/can/session/{session_id}/stop",
              "/data/can/session/{session_id}/frames",
              "/data/can/session/{session_id}/summary",
              "/db/health",
              "/db/smoke-test",
          ]

          missing = [path for path in required if path not in data["paths"]]
          if missing:
              raise SystemExit(f"Missing required routes: {missing}")
          PY

          echo "Checking PostgreSQL health..."
          curl -fsS http://127.0.0.1:8001/db/health
          echo

          echo "Checking PostgreSQL write path with rollback smoke test..."
          curl -fsS -X POST "http://127.0.0.1:8001/db/smoke-test?persist=false"
          echo

          echo "Checking CAN status..."
          curl -fsS http://127.0.0.1:8001/data/can/status
          echo

          echo "Checking /data/can end-to-end session/marker/frame/stop/summary path..."
          SESSION_ID=$(curl -fsS -X POST http://127.0.0.1:8001/data/can/session/start \
            -H "Content-Type: application/json" \
            -d '{
              "vehicle_slug": "2015-scion-frs",
              "mission_code": "A10",
              "label": "deploy smoke test A10 unlock",
              "bus_interface": "can2",
              "bus_mode": "listen-only",
              "metadata": {"source": "github-actions-deploy-smoke"}
            }' | python3 -c 'import sys,json; print(json.load(sys.stdin)["session_id"])')

          echo "Created session: $SESSION_ID"

          curl -fsS -X POST "http://127.0.0.1:8001/data/can/session/$SESSION_ID/marker" \
            -H "Content-Type: application/json" \
            -d '{
              "mission_code": "A10",
              "step_code": "unlock_fob",
              "marker_type": "action_start",
              "label": "Deploy smoke unlock marker",
              "timestamp_ms": 3000,
              "metadata": {"source": "github-actions-deploy-smoke"}
            }'
          echo

          curl -fsS "http://127.0.0.1:8001/data/can/session/$SESSION_ID/frames?limit=5"
          echo

          curl -fsS -X POST "http://127.0.0.1:8001/data/can/session/$SESSION_ID/stop" \
            -H "Content-Type: application/json" \
            -d '{"metadata": {"source": "github-actions-deploy-smoke", "result": "complete"}}'
          echo

          curl -fsS "http://127.0.0.1:8001/data/can/session/$SESSION_ID/summary"
          echo

      - name: Initial deployment complete
        run: |
          echo "AvenLab initial deployment complete."
