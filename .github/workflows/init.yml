name: Initial Deployment

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Confirm Node version
        run: |
          node -v
          npm -v

      - name: Create runtime directories
        run: |
          sudo mkdir -p /var/www/avenlab/bin
          sudo mkdir -p /var/www/avenlab/current/frontend
          sudo mkdir -p /var/www/avenlab/current/data-server

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Set up Python venv
        run: |
          cd data-server
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eux
          echo "HOME=$HOME"
          echo "USER=$(whoami)"

          if [ ! -x "$HOME/.cargo/bin/rustc" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"

          rustc --version
          cargo --version

      - name: Run project checks
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          npm run check

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build Rust physics server outside workspace
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd avenlab-server
          cargo build --release --target-dir /tmp/avenlab-rust-build

      - name: Install runtime files
        run: |
          sudo rsync -a --delete frontend/dist/ /var/www/avenlab/current/frontend/dist/
          sudo rsync -a --delete data-server/ /var/www/avenlab/current/data-server/
          sudo install -m 755 /tmp/avenlab-rust-build/release/avenlab-server /var/www/avenlab/bin/avenlab-server

      - name: Start physics service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl enable avenlab-physics
          sudo systemctl restart avenlab-physics
          sudo systemctl is-active --quiet avenlab-physics

      - name: Initial deployment complete
        run: |
          echo "AvenLab initial deployment complete."
