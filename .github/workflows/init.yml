name: Initial Deployment

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Confirm Node version
        run: |
          node -v
          npm -v

      - name: Create runtime directories
        run: |
          sudo install -d -o uri -g uri /var/www/avenlab/bin
          sudo install -d -o uri -g uri /var/www/avenlab/current/frontend
          sudo install -d -o uri -g uri /var/www/avenlab/current/data-server

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Pull Git LFS files
        run: |
          git lfs install
          git lfs pull

      - name: Verify GLB files are real
        run: |
          file frontend/public/models/vehicles/ae86.glb
          head -c 20 frontend/public/models/vehicles/ae86.glb
          echo

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eux
          echo "HOME=$HOME"
          echo "USER=$(whoami)"

          if [ ! -x "$HOME/.cargo/bin/rustc" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"

          rustc --version
          cargo --version

      - name: Run project checks
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          npm run check

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build Rust physics server outside workspace
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd avenlab-server
          cargo build --release --target-dir /tmp/avenlab-rust-build

      - name: Install runtime files
        run: |
          sudo rsync -a --delete --exclude '.venv' --chown=uri:uri data-server/ /var/www/avenlab/current/data-server/
          sudo rsync -a --delete --chown=uri:uri frontend/dist/ /var/www/avenlab/current/frontend/dist/
          sudo install -o uri -g uri -m 755 /tmp/avenlab-rust-build/release/avenlab-server /var/www/avenlab/bin/avenlab-server

      - name: Install production data-server venv
        run: |
          sudo -u uri bash -lc '
            cd /var/www/avenlab/current/data-server
            python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
          '

      - name: Start backend services
        run: |
          sudo systemctl daemon-reload

          sudo systemctl enable avenlab-data
          sudo systemctl restart avenlab-data
          sudo systemctl is-active --quiet avenlab-data

          sudo systemctl enable avenlab-physics
          sudo systemctl restart avenlab-physics
          sudo systemctl is-active --quiet avenlab-physics

      - name: Verify deployment
        run: |
          curl -f http://127.0.0.1:8001/health
          echo

          curl -f http://127.0.0.1:8001/openapi.json > /tmp/avenlab-openapi.json

          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/avenlab-openapi.json"))
          for path in sorted(data["paths"]):
              if "can" in path:
                  print(path)

          required = [
              "/data/can/status",
              "/data/can/session/start",
              "/data/can/session/{session_id}/marker",
              "/data/can/session/{session_id}/stop",
          ]

          missing = [path for path in required if path not in data["paths"]]
          if missing:
              raise SystemExit(f"Missing required CAN routes: {missing}")
          PY

          curl -f http://127.0.0.1:8001/data/can/status
          echo

      - name: Initial deployment complete
        run: |
          echo "AvenLab initial deployment complete."
