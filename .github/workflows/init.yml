name: Initial Deployment

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Confirm Node version
        run: |
          node -v
          npm -v

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Set up Python venv
        run: |
          cd data-server
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install Rust toolchain
        run: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Confirm Rust toolchain
        run: |
          source "$HOME/.cargo/env"
          rustc --version
          cargo --version

      - name: Run project checks
        run: |
          source "$HOME/.cargo/env"
          npm run check

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build Rust server
        run: |
          source "$HOME/.cargo/env"
          cd physics-server
          cargo build --release

      - name: Prepare runtime directories
        run: |
          mkdir -p data-server/data
          mkdir -p data-server/logs
          mkdir -p captures

      - name: Initial deployment complete
        run: |
          echo "AvenLab initial deployment complete."
